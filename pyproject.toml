[project]
name = "rayfish"
version = "0.2.0"
description = "Estimating parameters for discrete quantum imaging"
authors = [{ name = "Jernej Frank", email = "jernejfrank@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.9,<4.0"
dependencies = [
    "beartype >= 0.18.0",
    "click",
    "dash",
    "loguru",
    "notebook",
    "numpy>=1.21.3",
    "pandas",
    "pandera",
    "pyarrow",
    "pydantic",
    "scipy",
    "sf-hamilton[visualization]>=1.78",
    "typing_extensions > 4.0.0",
    "typing_inspect",
]

[project.urls]
Homepage = "https://jernejfrank.github.io/rayfish/"
Repository = "https://github.com/jernejfrank/rayfish"
Documentation = "https://jernejfrank.github.io/rayfish/"
"Bug Tracker" = "https://github.com/jernejfrank/rayfish/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.2",
    "pre-commit>=3.8.0",
    "tox>=4.18.1",
    "ruff>=0.6.4",
    "coverage[toml]>=7.6.1",
    "pytest-cov>=5.0.0",
    "pyright[nodejs]>=1.1.384",
]

[build-system]
requires = ["setuptools>=72.1"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = [
    "rayfish"
  ]
exclude = [
  "tests",
  "examples",
  "docs"
]
venvPath = "."
venv = ".venv"



[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.paths]
source = ["rayfish", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["rayfish"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
indent-width = 4
fix = true

[tool.ruff.lint]
select = [
  "A",  # flake8-builtins
  "ANN",  # flake8-annotations
  "B",  # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4", # flake8-comprehensions
  "C",  # mccabe
  "D",  # flake8-docstrings
  "E", "F",  # flake8
  "FA",  # Verifies files use from __future__ import annotations if a type is used in the module that can be rewritten using PEP 563.
  "FURB", # Refurbishing and modernizing Python codebases
  "G",  # flake8-logging-format
  "I",  # isort
  "ISC",  # flake8-implicit-str-concat
  "LOG", # Checks for issues using the standard library logging module.
  "N",  # pep8-naming
  "NPY", # Linting rules for numpy
  "PERF",# Linting rules for performance
  "PGH", # pygrep-hooks
  "Q",   # Linting rules for quites
  "RUF",  # Ruff-specific rules
  "S",  # flake8-bandit
  "SIM",  # flake8-simplify
  "T10", # flake8-debugger
  "T20", # Check for Print statements in python files.
  "TCH", # Move type-only imports to a type-checking block.
  "TID", # Helps you write tidier imports.
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W",   # pycodestyle warnings
  "YTT", # flake8-2020,
]

ignore = [
    "ANN101",
    "E731",
    "F403",
    "PGH003",
    "PGH004",
]

unfixable = [
  "ERA",  # Don't remove commented-out code
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
]
"__init__.py" = [
    "F401",
    "D104"
]
