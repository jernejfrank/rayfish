[project]
name = "oqula"
version = "0.0.1"
description = "Estimating parameters for discrete quantum imaging"
authors = [{ name = "Jernej Frank", email = "jernejfrank@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.9,<4.0"
dependencies = [
    "numpy",
    "pandas",
    "pandera",
    "pyarrow",
    "pydantic",
    "beartype >= 0.18.0",
    "typing_extensions > 4.0.0",
    "typing_inspect",
]

[project.urls]
Homepage = "https://jernejfrank.github.io/oqula/"
Repository = "https://github.com/jernejfrank/oqula"
Documentation = "https://jernejfrank.github.io/oqula/"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.2",
    "pre-commit>=3.8.0",
    "tox>=4.18.1",
    "mypy>=1.11.2",
    "ruff>=0.6.4",
]

[build-system]
requires = ["setuptools>=72.1"]
build-backend = "setuptools.build_meta"

[tool.mypy]
files = ["estimator"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4
fix = true



[tool.ruff.lint]
select = [
  "YTT", # flake8-2020,
  "E", "F", "W",  # flake8
  "C",  # mccabe
  "I",  # isort
  "N",  # pep8-naming
  "C4", # flake8-comprehensions
  "D",  # flake8-docstrings
  "ANN",  # flake8-annotations
  "S",  # flake8-bandit
  "BLE",  # flake8-blind-except
  "B",  # flake8-bugbear
  "A",  # flake8-builtins
  "G",  # flake8-logging-format
  "ISC",  # flake8-implicit-str-concat
  "RUF",  # Ruff-specific rules
  "T10", # flake8-debugger
  "SIM",  # flake8-simplify
  "UP", # pyupgrade
  "PGH", # pygrep-hooks
  "TRY", # tryceratops
]

ignore = [
    "ANN101",
    "E731",
]

unfixable = [
  "ERA",  # Don't remove commented-out code
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["D104"]
